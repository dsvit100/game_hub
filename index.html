<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090C1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>우주 미니게임 | 부천천문과학관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #090C1F;
    --bg2: #131A3D;
    --accent1: #5b8dff;
    --accent2: #4FD8C4;
    --text-main: #ECEDF6;
    --text-dim: #B7C0E8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { 
    margin: 0; padding: 0; height: 100%; 
    font-family: 'Gothic A1', sans-serif; 
    background: var(--bg1); color: var(--text-main); 
    overflow-x: hidden; 
    -webkit-user-select: none; user-select: none;
  }
  a { text-decoration: none; -webkit-user-drag: none; }
  #app {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; max-width: 480px; margin: 0 auto; position: relative; z-index: 1;
  }
  .stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .stars span { position: absolute; background: #fff; border-radius: 50%; opacity: 0.7; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  
  .header { text-align: center; margin-bottom: 40px; animation: fadein 0.5s ease; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; letter-spacing: .35em; font-size: 13px; color: var(--accent2); margin-bottom: 12px; font-weight: 700; }
  h1 { font-size: clamp(26px, 6vw, 32px); font-weight: 800; margin: 0 0 12px; line-height: 1.3; }
  p.desc { font-size: 15px; color: var(--text-dim); line-height: 1.6; margin: 0; }
  
  .game-list { width: 100%; display: flex; flex-direction: column; gap: 18px; animation: fadein 0.6s ease; }
  .game-card {
    background: var(--bg2); border: 2px solid rgba(183,192,232,0.2); border-radius: 20px;
    padding: 28px 24px; text-decoration: none; color: var(--text-main); display: flex; flex-direction: column;
    transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.2s; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .game-card:active { transform: scale(0.96); border-color: var(--accent2); }
  
  .game-card .icon { font-size: 42px; margin-bottom: 16px; line-height: 1; }
  .game-card .g-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  .game-card .g-title::after { content: '→'; opacity: 0.5; font-weight: 500; font-size: 20px; transition: opacity 0.2s; }
  .game-card:active .g-title::after { opacity: 1; color: var(--accent2); }
  .game-card .g-desc { font-size: 14.5px; color: var(--text-dim); line-height: 1.6; word-break: keep-all; }
  
  .game-card.gb { background: linear-gradient(145deg, #131A3D, #1A1F4C); }
  .game-card.gb .g-title { color: #8BA8FF; }
  
  .game-card.pm { background: linear-gradient(145deg, #131A3D, #221D38); }
  .game-card.pm .g-title { color: #F5C86B; }
  
  .footer { margin-top: 50px; font-size: 12px; color: rgba(183,192,232,0.5); font-weight: 600; text-align: center; animation: fadein 0.7s ease; }
  
  @keyframes fadein { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body oncontextmenu="return false;">

<div class="stars" id="stars"></div>

<div id="app">
  <div class="header">
    <div class="eyebrow">BUCHEON ASTRO</div>
    <h1>우주 미니게임 허브</h1>
    <p class="desc">부천천문과학관에 오신 것을 환영합니다.<br>플레이할 게임을 선택해 주세요!</p>
  </div>
  
  <div class="game-list">
    <!-- 골든벨 링크 -->
    <a href="https://dsvit100.github.io/goldenbell/goldenbell.html" class="game-card gb">
      <div class="icon">🚀</div>
      <div class="g-title">우주 퀴즈 골든벨</div>
      <div class="g-desc">우주 상식을 맞춰보는 퀴즈! 15문제를 풀고 최고 랭킹과 상품에 도전해보세요.</div>
    </a>
    
    <!-- 행성 수박게임 링크 (https로 연결 권장) -->
    <a href="https://dsvit100.github.io/planet/game6_planet.html" class="game-card pm">
      <div class="icon">🪐</div>
      <div class="g-title">행성 수박게임</div>
      <div class="g-desc">같은 행성을 합쳐 더 큰 행성으로! 마지막 단계인 태양을 만들어보세요.</div>
    </a>
  </div>
  
  <div class="footer">© 부천천문과학관. All rights reserved.</div>
</div>

<script>
  // 배경 별 생성 애니메이션
  const wrap = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.width = s.style.height = (Math.random() * 1.5 + 0.8) + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    wrap.appendChild(s);
  }
  
  // 모바일 드래그 방지
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
